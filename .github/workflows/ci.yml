
name: CI Pipeline

on:
  pull_request:
    branches:
      - develop/pipline-BC-BJS2-77818

jobs:
  build:
    # runs-on: ubuntu-22.04
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Run Gradle Test
        run: ./gradlew test --stacktrace