
name: CI Pipeline

on:
  pull_request:
    branches:
      ["develop/pipeline-77818"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          # distribution: 'temurin'
          distribution: 'corretto'
          java-version: 17

      - name: Run Gradle Test
        run: ./gradlew test --stacktrace