name: CI unicorn8 user_service

on:
  pull_request:
    branches:
      - feature/pipeline-BJS2-52782
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      #- name: Setup Gradle
      #uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 

      - name: build, checkstyle, test
        run: ./gradlew build test -x testClasses checkstyleMain checkstyleTest --no-daemon --continue

      - name: Checkstyle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle_report
          path: build/reports/checkstyle


  

