name: CI Pipeline

on:
  push:
    branches:
    - minotaur-master-stream9

  pull_request:
    branches:
    - minotaur-master-stream9

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant execute permission for Gradle Wrapper
      run: chmod +x gradlew

    - name: Run Tests
      run: ./gradlew test

    - name: Run Build
      run: ./gradlew build