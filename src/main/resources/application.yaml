spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost

redis:
  channels:
   profile_pic: profile_pic_channel
   follower_event: follower-events
   skill_acquired: skill_acquired_topic

server:
  port: 8080

logging:
  level:
    root: info

project-service:
  host: localhost
  port: 8082

payment-service:
  host: localhost
  port: 9080

minio:
  end_point: "http://localhost:9000"
  access_key: "user"
  secret_key: "password"
  region: "us-east-1"
  bucket: "user-pictures-bucket"
  content_length: 20_971_520

kafka:
  host: "localhost:9092"
  topics:
    recommendation: "recommendation"
  partitions: 3
  replication-factor: 1
  properties:
    security.protocol: SSL
    ssl.truststore.location: /path/to/truststore.jks
    ssl.truststore.password: password

dice-bear-api: "https://api.dicebear.com/9.x/pixel-art/svg"


event:
  removal:
    cron: "0 0 2 * * *"
    batch-size: 100

thread-pool-config:
  size: 10

