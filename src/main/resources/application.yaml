spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost
      channel:
        premium-bought: premium_bought_channel
        mentorship: mentorship_channel

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

logging:
  level:
    root: info

project-service:
  url: http://localhost:8082

payment-service:
  url: http://localhost:9080

user:
  password:
    min:
      length: 6

goal:
  active:
    amount: 2

aws:
  region: ${AWS_REGION:eu-north-1}
  credentials:
    access-key: ${AWS_ACCESS_KEY_ID:dummy-access-key}
    secret-key: ${AWS_SECRET_ACCESS_KEY:dummy-secret-key}
  s3:
    bucket: ${AWS_S3_BUCKET:hydra12}

avatar:
  dicebear:
    base-url: "https://api.dicebear.com/9.x/open-peeps/png"
    default-size: 256

scheduler:
  thread-pool-size: 10
  batch-size: 100
  expired-events:
    cron: "0 0 2 * * ?"  # каждый день в 2 ночи