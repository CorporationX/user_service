spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost
      channel:
        profile-view: profile-view-events
        mentorship-requested: mentorship.requested
  
  web:
    mvc:
      pathmatch:
        matching-strategy: ant_path_matcher # Uses traditional path matching

  kafka:
    bootstrap-servers: localhost:9094
    acks: all
    retries: 5
    delivery-timeout-ms: 20000
    linger-ms: 5
    request-timeout-ms: 3000
    batch-size: 16384
    enable-idempotence: true
    topics:
      profile-view: profile-view-events

server:
  port: 8080
  servlet:
    context-path: /api/v1 # All endpoints get this prefix

logging:
  level:
    root: info

project-service:
  host: localhost
  port: 8082

payment-service:
  host: localhost
  port: 9080

dicebear:
  api-url: https://api.dicebear.com/9.x
  style: pixel-art
  default-seed: defaultUserSeed
