spring:
  config:
    import: optional:classpath:application.properties

  application:
    name: user-service

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  profiles:
    active: local

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
    password: ${REDIS_PASSWORD}

  outbox:
    fixed-delay-ms: 5000
    page-size: 100

  kafka:
    bootstrap-servers: ${KAFKA_HOST}:${KAFKA_PORT}
    consumer:
      trustedPackage: "faang.school.user_service.dto*"
    topics:
      recommendation: "recommendation-topic"
      post-created: "post.created"
      post-to-feed: "post.to-feed"
    producer:
      acks: all
      retries: 5
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5

server:
  port: 8080

logging:
  level:
    root: info

project-service:
  host: localhost
  port: 8082

payment-service:
  host: localhost
  port: 9080

user:
  avatar:
    max:
      sizeMb: 5
    allowed:
      types: "image/png,image/jpeg,image/jpg,image/webp"
  password:
    min:
      length: 6
  max-ids-per-request: 100

skills:
  min-offers-for-acquire: 3

schedule:
  events-cron: "0 0 0 * * *"

services:
  s3:
    endpoint: ${MINIO_ENDPOINT}:${MINIO_PORT}
    accessKey: ${MINIO_ACCESS_KEY}
    secretKey: ${MINIO_SECRET_KEY}
    bucketName: ${MINIO_BUCKET_NAME}


redis:
  topics:
    name:
      user-ban-topic: "user-ban-topic"
      mentorship-offered: "mentorship-offered"
      event-start-topic: "event_start_topic"

scheduler:
  clear-events:
    cron: "0 0 1 ? * MON"
    batch-size: 5000

recommendation:
  time:
    limit: 6

thread:
  taskScheduler:
    thread-pool-size: 10
    await-termination-second: 30

event-notification:
  one-day: 24
  five-hours: 5
  one-hour: 1
  ten-minutes: 10