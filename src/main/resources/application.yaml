skill:
  minimal:
    offers: 3

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5433/postgres
    username: user
    password: password
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost
      topic:
        recommendation: "recommendation:requested"

server:
  port: 8080

logging:
  level:
    root: info
    org.springframework.web: DEBUG
    org.springframework.http.converter.json: DEBUG

project-service:
  host: localhost
  port: 8082

payment-service:
  host: localhost
  port: 9080

user:
  password:
    min:
      length: 6


redis:
  host: localhost
  port: 6379


task:
  scheduling:
    cron: "0 * * * * ?"
=======
app:
  goals:
    max-active-goals: 3

recommendation:
  repeat:
    limit: 6


premium:
  remover:
    cron: "0 0 0 * * MON"
    batch-size: 100

