spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
          batch_versioned_data: true
          order_inserts: true
          order_updates: true
  data:
    redis:
      port: 6379
      host: localhost
      channel:
        recommendation-channel: recommendation_channel
        goalCompleted: goalCompletedChannel

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  cloud:
    openfeign:
      client:
        config:
          payment-service:
            url: http://localhost:9080/api/
            connect-timeout: 5000
            read-timeout: 5000

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB       # лимит на один файл
      max-request-size: 5MB    # лимит на весь запрос

mvc:
  servlet:
    path: /api/v1

server:
  port: 8080

logging:
  level:
    root: info

services:
  s3:
    endpoint: http://127.0.0.1:9000
    accessKey: user
    secretKey: password
    bucketName: corpbucket

profile-pic:
  maxSize: 5242880
  largePhotoSize: 1080
  smallPhotoSize: 170

project-service:
  host: localhost
  port: 8082

payment-service:
  host: localhost
  port: 9080

app:
  number_months_membership: 3
  batch_size: 100
  max_iterations_to_find_db: 1000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

cron:
  expression:
    delete_old_events: "0 23 * * * 6"

premium:
  scheduler:
    time-to-run-remove-expired-premium: "0 0 0 * * Sun" # every sunday at 0 a.m.
    number-of-threads: 8
    batch-size: 100