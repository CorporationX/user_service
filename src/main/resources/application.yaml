spring:
  config:
    import: 'optional:consul:'
  application:
    name: user-service
  cloud:
    consul:
      host: localhost
      port: 8500
      config:
        enabled: true
        watch:
          enabled: true


  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost
  kafka:
    producer:
      bootstrap-servers: localhost:9092, localhost:9094
      client-id: user-service
      acks: all
      properties:
        linger:
          ms: 0
    consumer:
      bootstrap-servers: localhost:9092, localhost:9094
      group-id: analytics-created
    topics:
      analytics-created:
        name: analytics-created-event-topic
        partitions: 1
        replication-factor: 3
        dlt:
          name: ${spring.kafka.topics.analytics-created.name}.DLT
          partitions: 1
          replication-factor: 3



server:
  port: 8080

logging:
  level:
    root: info

project-service:
  host: localhost
  port: 8082

payment-service:
  host: localhost
  port: 9080

management:
  endpoints:
    web:
      exposure:
        include: refresh

  logging:
    level:
      org.springframework.cloud.consul: DEBUG
      org.springframework.cloud.bootstrap.config: DEBUG

