app:
  config:
    min_skill_offers: 3
    active_transaction: 5
    passive_transaction: 2
    dicebear_url: "${DICEBEAR_URL:https://api.dicebear.com/9.x/adventurer/svg?seed={seed}}"
    avatar_file_size: 5242880
    avatar_bucket_name: user-avatars
    avatar_large_file_size: 1080
    avatar_small_file_size: 170
    max_data_group_size: 1000
    clear_events_sheduled_cron: "0 0 0 * * 1"

spring:
  mvc:
    servlet:
      path: /api/v1
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}
    username: ${DB_USERNAME:user}
    password: ${DB_PASSWORD:password}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: ${REDIS_PORT:6379}
      host: ${REDIS_HOST:localhost}
      topic:
        user-ban: user_ban

  kafka:
    topics:
      goal-completed: goal-completed
      recommendation-requested: recommendation-requested
      follower: follower_topic
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      enable-idempotence: true
      max-in-flight-requests-per-connection: 5
    consumer:
      group-id: user-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: info

project-service:
  host: localhost
  port: 8082

payment-service:
  host: ${PAYMENT_SERVICE_HOST:localhost}
  port: ${PAYMENT_SERVICE_PORT:9080}

promotion-service:
  host: ${PROMOTION_SERVICE_HOST:localhost}
  port: ${PROMOTION_SERVICE_PORT:8089}

premium:
  schedule: "0 0 0 * * 1"
  batch-size: 100

thread-pool-config:
  size: 5